<article>
  <h1>{{title}}</h1>
  <div class="meta">
    <time datetime="{{date_iso}}">{{date_display}}</time>{{#updated_display}}<span class="updated">(updated <time datetime="{{updated_iso}}">{{updated_display}}</time>)</span>{{/updated_display}}
    {{#tags}}<span class="tags">{{tags_html}}</span>{{/tags}}
  </div>
  {{#lang_nav}}<nav class="lang-nav">{{lang_nav}}</nav>{{/lang_nav}}
  {{#ai_notice}}<div class="ai-notice">{{ai_notice}}</div>{{/ai_notice}}
  <div class="post-body">
    {{content}}
  </div>
  {{#post_nav}}<nav class="post-nav">{{post_nav}}</nav>{{/post_nav}}
</article>
